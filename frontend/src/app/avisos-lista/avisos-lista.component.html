<p *ngIf="cargando" class="nota">Cargando avisos...</p>
<p *ngIf="error" class="nota mal">{{ error }}</p>
<p *ngIf="mensaje" class="nota" [class.ok]="mensajeOk" [class.mal]="!mensajeOk">{{ mensaje }}</p>

<div class="tarjetas">
  <article *ngFor="let aviso of avisos" class="tarjeta">
    <span class="chip">{{ aviso.categoria?.nombre }}</span>
    <h3><a [routerLink]="['/avisos', aviso.id]">{{ aviso.titulo }}</a></h3>
    <p>{{ aviso.contenido }}</p>
    <small>{{ aviso.autor }} · {{ aviso.creado | date:'dd/MM/yyyy' }}</small>
    <button *ngIf="sesion.token" class="peligro" (click)="borrar(aviso)">Borrar</button>
  </article>
</div>

<div *ngIf="!cargando && !error" class="fila" style="justify-content: space-between; align-items: center; margin-top: 12px;">
  <button [disabled]="paginaActual <= 1" (click)="cargar(paginaActual - 1)">Anterior</button>
  <strong>Página {{ paginaActual }} de {{ paginaUltima }} · {{ totalAvisos }} avisos</strong>
  <button [disabled]="paginaActual >= paginaUltima" (click)="cargar(paginaActual + 1)">Siguiente</button>
</div>

<p *ngIf="!cargando && !error && avisos.length === 0" class="vacio">Tu API no tiene avisos publicados.</p>
