# CI del Curso 2. Verde = requisito mínimo de la entrega, no la calificación.
# Los checks crecen con el curso:
#   Sesión 1+  → assets: npm ci && npm run build
#   Sesión 2+  → descomentar "backend": composer install + migraciones (SQLite)
#   Sesión 6+  → descomentar los tests dentro de "backend"
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  assets:
    name: Build de assets (Vite + Tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Antes de la sesion 1 el repo es solo la plantilla (sin package.json):
      # el job pasa en verde y avisa. En cuanto el proyecto existe, el build es real.
      - name: Detectar proyecto
        id: proyecto
        run: |
          if [ -f package.json ]; then
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
            echo "Sin package.json todavia (el proyecto nace en la sesion 1): nada que construir."
          fi
      - uses: actions/setup-node@v4
        if: steps.proyecto.outputs.existe == 'si'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.proyecto.outputs.existe == 'si'
      - run: npm run build
        if: steps.proyecto.outputs.existe == 'si'

